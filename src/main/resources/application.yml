spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/sportshop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
app:
  jwt-secret: ${JWT_SECRET:}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
